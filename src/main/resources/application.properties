# The processor is a batch job, not a web application.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.application.name=concurrent-csv-processor

# Input and output files (relative to the folder the application is started from).
app.input-file=data/employees.csv
app.output-file=output/employees_updated.csv

# Number of worker threads in the thread pool.
app.thread-pool-size=4

# Maximum number of tasks allowed to calculate at the same time (Semaphore permits).
app.max-concurrent-tasks=4

# Date used to calculate years worked, in yyyy-MM-dd format. Leave empty to use today's date.
app.reference-date=
